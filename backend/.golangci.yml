version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - contextcheck
    - errorlint
    - goconst
    - misspell
    - nilerr
    - revive
    - sqlclosecheck
    - unconvert
  settings:
    revive:
      rules:
        # Правило требует doc-комментарий у каждого экспортируемого идентификатора.
        # Doc-блоки из кода убраны намеренно, так что правило давало бы сотни
        # находок на том, что решено не писать.
        - name: exported
          disabled: true
    goconst:
      # Таблицы регионов в routing_test.go перечисляют платформы построчно, а
      # goconst считает вхождения по всему пакету - из-за тестов ключи map в
      # routing.go выглядели как «повторяющиеся строки». Исключение по пути тут
      # не помогает: оно прячет findings в тестах, но не убирает их из подсчёта.
      ignore-tests: true

formatters:
  enable:
    - gofmt
